<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para tus 28</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-border: #2a2a2a;
      --accent-color: #ffffff;
      --text-muted: #888888;
      --redeemed-bg: #141414;
      --redeemed-text: #444444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--accent-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    /* Screen Transitions */
    .screen {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #welcome-screen {
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }

    #coupons-screen {
      display: none;
    }

    /* Welcome Typography */
    .big-number {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 40px;
    }

    /* Buttons */
    .btn-main {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    .btn-redeem {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn-redeem:active {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    /* Coupons Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Grid Layout */
    .grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    /* Card Item */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .card-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
    }

    .card.open .card-body {
      max-height: 150px;
      opacity: 1;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }

    .card-desc {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.4;
    }

    /* Redeemed State */
    .card.redeemed {
      background-color: var(--redeemed-bg);
      border-color: #1a1a1a;
      opacity: 0.6;
    }

    .card.redeemed .card-title,
    .card.redeemed .card-num {
      color: var(--redeemed-text);
      text-decoration: line-through;
    }

    .badge-redeemed {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #666;
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Welcome -->
  <div id="welcome-screen" class="screen">
    <div class="big-number">28</div>
    <div class="subtitle">Para tus 28.</div>
    <div class="tagline">28 oportunidades para cobrarme cosas.</div>
    <button class="btn-main" onclick="openCoupons()">ABRIR</button>
  </div>

  <!-- Screen 2: Coupons Grid -->
  <div id="coupons-screen" class="screen">
    <div class="header">
      <h1>TUS CUPONES</h1>
      <p>Toca uno para ver el detalle o canjearlo</p>
    </div>
    <div class="grid" id="coupons-container"></div>
  </div>

  <script>
    const couponsData = [
      { id: "01", title: "PLAN SECRETO", desc: "Tú no organizas nada. Yo me encargo de todo el plan." },
      { id: "02", title: "HOY ES TU DÍA", desc: "Tú eliges qué comemos, qué vemos y qué hacemos hoy." },
      { id: "03", title: "MASAJE VIP", desc: "Sin cronómetro. Se termina únicamente cuando tú digas." },
      { id: "04", title: "VALE POR UN ANTOJO", desc: "Válido para pedir lo que quieras comer, a la hora que sea." },
      { id: "05", title: "NO HAY DISCUSIÓN", desc: "Ganas esta conversación automáticamente sin dar explicaciones." },
      { id: "06", title: "MARATÓN A TU GUSTO", desc: "Vemos la serie o película que elijas, sin quejas." },
      { id: "07", title: "DESAYUNO A LA CAMA", desc: "Te despiertas y el desayuno ya está listo." },
      { id: "08", title: "NOCHE DE CITAS", desc: "Una salida especial planificada solo para los dos." },
      { id: "09", title: "DESCONEXIÓN TOTAL", desc: "Un par de horas solo para descansar, relajarte y cero estrés." },
      { id: "10", title: "POSTRE A ELECCIÓN", desc: "Un postre delicioso comprado o preparado a tu gusto." },
      { id: "11", title: "SALIDA CAFETERA", desc: "Un café y algo rico en tu lugar favorito." },
      { id: "12", title: "TARDE DE JUEGOS / RELAJACIÓN", desc: "Hacemos la actividad tranquila que más tengas ganas de hacer." },
      { id: "13", title: "SIESTA SIN INTERRUPCIONES", desc: "Nadie te molesta durante el tiempo que decidas dormir." },
      { id: "14", title: "MIMOS EXTRA", desc: "Dosis doble de atención y mimos cuando los necesites." },
      { id: "15", title: "A COMER FUERA", desc: "Eliges el restaurante y vamos a comer rico." },
      { id: "16", title: "VALE POR UN FAVOR", desc: "Hago un mandado o tarea por ti sin peros." },
      { id: "17", title: "MÚSICA Y VIAJE", desc: "Tú pones la música durante todo el recorrido en auto/paseo." },
      { id: "18", title: "ABRAZO REPARADOR", desc: "Válido para un abrazo largo y reconfortante en cualquier momento." },
      { id: "19", title: "COMPRAS JUNTOS", desc: "Te acompaño a ver tiendas o hacer compras con paciencia total." },
      { id: "20", title: "CENA CASERA", desc: "Cocino tu platillo favorito hecho en casa." },
      { id: "21", title: "NOCHE DE SNACKS", desc: "Mucha comida rica y botanita para ver películas en casa." },
      { id: "22", title: "ESCAPADA DE FIN DE SEMANA", desc: "Cambiamos de aire y salimos a pasear un rato." },
      { id: "23", title: "DETALLE SORPRESA", desc: "Un pequeño regalo o sorpresa que no te esperas." },
      { id: "24", title: "VALE POR UN HELADO", desc: "Nos vamos por tu helado favorito." },
      { id: "25", title: "TIEMPO A TU AIRE", desc: "Espacio totalmente libre para que hagas lo que quieras." },
      { id: "26", title: "DÍA DE FOTOGRAFÍAS", desc: "Te tomo todas las fotos que quieras hasta que quedes feliz." },
      { id: "27", title: "CERO TAREAS POR HOY", desc: "Yo me hago cargo de los pendientes del día." },
      { id: "28", title: "CUPÓN COMODÍN", desc: "Válido por lo que quieras pedir (dentro de lo razonable 😉)." }
    ];

    function openCoupons() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('coupons-screen').style.display = 'flex';
      renderCoupons();
    }

    function renderCoupons() {
      const container = document.getElementById('coupons-container');
      container.innerHTML = '';

      const redeemedList = JSON.parse(localStorage.getItem('redeemedCoupons') || '[]');

      couponsData.forEach(coupon => {
        const isRedeemed = redeemedList.includes(coupon.id);
        const card = document.createElement('div');
        card.className = `card ${isRedeemed ? 'redeemed' : ''}`;
        card.id = `card-${coupon.id}`;

        card.innerHTML = `
          <div class="card-header" onclick="toggleCard('${coupon.id}')">
            <div>
              <div class="card-num">${coupon.id} · CUPÓN</div>
              <div class="card-title">${coupon.title}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-desc">${coupon.desc}</div>
            ${
              isRedeemed 
              ? `<div class="badge-redeemed">CANJEADO 🖤</div>`
              : `<button class="btn-redeem" onclick="redeemCoupon(event, '${coupon.id}')">CANJEAR 🖤</button>`
            }
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleCard(id) {
      const card = document.getElementById(`card-${id}`);
      const isOpen = card.classList.contains('open');
      
      // Close other open cards
      document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));

      if (!isOpen) {
        card.classList.add('open');
      }
    }

    function redeemCoupon(event, id) {
      event.stopPropagation();
      let redeemedList = JSON.parse(localStorage.getItem('redeemedCoupons') || '[]');
      if (!redeemedList.includes(id)) {
        redeemedList.push(id);
        localStorage.setItem('redeemedCoupons', JSON.stringify(redeemedList));
      }
      renderCoupons();
    }
  </script>
</body>
</html>
