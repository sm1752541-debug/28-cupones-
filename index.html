<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para tus 28</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-border: #2a2a2a;
      --accent-color: #ffffff;
      --text-muted: #888888;
      --redeemed-bg: #141414;
      --redeemed-text: #444444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--accent-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    /* Screen Transitions */
    .screen {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #welcome-screen {
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }

    #coupons-screen {
      display: none;
    }

    /* Welcome Typography */
    .big-number {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 40px;
    }

    /* Buttons */
    .btn-main {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    .btn-redeem {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn-redeem:active {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    /* Coupons Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Grid Layout */
    .grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    /* Card Item */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .card-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
    }

    .card.open .card-body {
      max-height: 150px;
      opacity: 1;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }

    .card-desc {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.4;
    }

    /* Redeemed State */
    .card.redeemed {
      background-color: var(--redeemed-bg);
      border-color: #1a1a1a;
      opacity: 0.6;
    }

    .card.redeemed .card-title,
    .card.redeemed .card-num {
      color: var(--redeemed-text);
      text-decoration: line-through;
    }

    .badge-redeemed {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #666;
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Welcome -->
  <div id="welcome-screen" class="screen">
    <div class="big-number">28</div>
    <div class="subtitle">Para tus 28.</div>
    <div class="tagline">28 oportunidades para cobrarme cosas.</div>
    <button class="btn-main" onclick="openCoupons()">ABRIR</button>
  </div>

  <!-- Screen 2: Coupons Grid -->
  <div id="coupons-screen" class="screen">
    <div class="header">
      <h1>🖤 28 CUPONES</h1>
      <p>Toca uno para ver el detalle o canjearlo</p>
    </div>
    <div class="grid" id="coupons-container"></div>
  </div>

  <script>
    const couponsData = [
      { id: "01", title: "PLAN SECRETO 🎟️", desc: "Yo me encargo de organizarlo. Tu única misión es estar listo." },
      { id: "02", title: "HOY ES TU DÍA 👑", desc: "Por unas horas, tienes el control absoluto del plan." },
      { id: "03", title: "MASAJE VIP 💆🏻‍♂️", desc: "Sin cronómetro. Se termina cuando tú digas." },
      { id: "04", title: "REGALO A LA CARTA 🎁", desc: "Dime qué se te antoja recibir y vemos cómo hacerlo realidad." },
      { id: "05", title: "OPERACIÓN “ALÍSTATE” 🕶️", desc: "No necesitas saber dónde vamos. Solo prepárate y sígueme la corriente." },
      { id: "06", title: "TÚ PONES LA PELÍCULA 🍿", desc: "Y yo acepto mi destino sin comentarios. 😂" },
      { id: "07", title: "PASE LIBRE 😌", desc: "Una pequeña travesura queda oficialmente perdonada." },
      { id: "08", title: "ESTA VEZ INVITO YO 💸", desc: "El plan puede ser tuyo, pero la cuenta es mía." },
      { id: "09", title: "FUERA DE LA RUTINA 🎟️", desc: "Vamos a hacer algo que normalmente no haríamos." },
      { id: "10", title: "ELIGE ENTRE TRES 🎯", desc: "Tres planes, una elección y cero posibilidad de decir “me da igual”." },
      { id: "11", title: "LENCERÍA PARA TI 🔥", desc: "Hoy tú decides cuál de mis conjuntos quieres ver." },
      { id: "12", title: "BESOS SIN RELOJ 💋", desc: "No hay prisa. No hay horario. Solo nosotros." },
      { id: "13", title: "CARTA GANADORA 🃏", desc: "Una discusión queda a tu favor. Guárdala para cuando realmente la necesites. 😂" },
      { id: "14", title: "NO PREGUNTES 🤫", desc: "Tengo algo preparado. Tu trabajo es dejarte sorprender." },
      { id: "15", title: "RETO A TU NOVIA 😈", desc: "Ponme un reto y veremos si de verdad me atrevo." },
      { id: "16", title: "MODO CONSENTIDO 👑", desc: "Hoy te toca recibir mimos, atención y todo el cariño que pueda darte." },
      { id: "17", title: "CUPÓN DEL SÍ ✔️", desc: "Una petición razonable obtiene un “sí” automático." },
      { id: "18", title: "MODO AVIÓN 📵", desc: "Una cita sin teléfonos, notificaciones ni interrupciones." },
      { id: "19", title: "ESCOGE EL LUGAR 📍", desc: "El destino lo eliges tú. Yo me encargo de que el resto funcione." },
      { id: "20", title: "PUERTA CERRADA 🖤", desc: "Una noche para olvidarnos del reloj y del resto del mundo." },
      { id: "21", title: "SIN REGLAS 🔥", desc: "Lencería, confianza y libertad para explorar juntos." },
      { id: "22", title: "SOLO NOSOTROS 🖤", desc: "Privacidad, calma y tiempo de calidad para los dos." },
      { id: "23", title: "BDSM SIN MIEDO ⛓️", desc: "Una oportunidad para explorar roles y juegos de confianza juntos, sin vergüenza." },
      { id: "24", title: "UNA PRENDA MENOS 😈", desc: "Para cuando queramos subirle un poquito la temperatura a la noche." },
      { id: "25", title: "UNA PRENDA MENOS… AFUERA 🔥", desc: "Durante una salida, puedes señalar el momento y empieza nuestro pequeño secreto." },
      { id: "26", title: "ELIGE MI LOOK 👠", desc: "Esta vez tú decides qué outfit voy a llevar para nuestra cita." },
      { id: "27", title: "PARA GUARDAR 😏", desc: "No se canjea por impulso. Se reserva para ese momento en que ambos digamos: “ahora”." },
      { id: "28", title: "CARTA EN BLANCO 🖤", desc: "Tú propones el plan y entre los dos decidimos cómo convertirlo en una experiencia inolvidable." }
    ];

    function openCoupons() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('coupons-screen').style.display = 'flex';
      renderCoupons();
    }

    function renderCoupons() {
      const container = document.getElementById('coupons-container');
      container.innerHTML = '';

      const redeemedList = JSON.parse(localStorage.getItem('redeemedCoupons') || '[]');

      couponsData.forEach(coupon => {
        const isRedeemed = redeemedList.includes(coupon.id);
        const card = document.createElement('div');
        card.className = `card ${isRedeemed ? 'redeemed' : ''}`;
        card.id = `card-${coupon.id}`;

        card.innerHTML = `
          <div class="card-header" onclick="toggleCard('${coupon.id}')">
            <div>
              <div class="card-num">${coupon.id} · CUPÓN</div>
              <div class="card-title">${coupon.title}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-desc">${coupon.desc}</div>
            ${
              isRedeemed 
              ? `<div class="badge-redeemed">CANJEADO 🖤</div>`
              : `<button class="btn-redeem" onclick="redeemCoupon(event, '${coupon.id}')">CANJEAR 🖤</button>`
            }
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleCard(id) {
      const card = document.getElementById(`card-${id}`);
      const isOpen = card.classList.contains('open');
      
      document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));

      if (!isOpen) {
        card.classList.add('open');
      }
    }

    function redeemCoupon(event, id) {
      event.stopPropagation();
      let redeemedList = JSON.parse(localStorage.getItem('redeemedCoupons') || '[]');
      if (!redeemedList.includes(id)) {
        redeemedList.push(id);
        localStorage.setItem('redeemedCoupons', JSON.stringify(redeemedList));
      }
      renderCoupons();
    }
  </script>
</body>
</html>
